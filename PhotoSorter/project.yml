name: PhotoSorter
options:
  bundleIdPrefix: com.photosorter.app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.5.1

targets:
  PhotoSorter:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: "PhotoSorter"
        NSFaceIDUsageDescription: "PhotoSorter uses Face ID to keep your private photo folders locked so only you can open them."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.photosorter.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: "YES"
    dependencies:
      - package: Supabase
        product: Supabase
